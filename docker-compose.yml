# Local development services. Production runs on AWS (see docs/06-deployment.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jagruk
      POSTGRES_PASSWORD: jagruk
      POSTGRES_DB: jagruk
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jagruk -d jagruk"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
